name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/ -x -q --tb=short

  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run agent tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: cd agent && python -m pytest tests/ -x -q --tb=short -m "not smoke"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  web-image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web image deps (mirrors Dockerfile)
        run: pip install -r requirements-web.txt

      - name: Verify API imports with web deps only
        env:
          DB_PATH: ":memory:"
          SESSION_SECRET: "ci-check"
        run: python -c "from api.main import app; print('OK')"

  deploy-staging:
    needs: [backend-tests, agent-tests, lint, web-image-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy to staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/railway_response.json -w "%{http_code}" \
            -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"'${{ secrets.RAILWAY_STAGING_SERVICE_ID }}'\", environmentId: \"'${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID }}'\")}"}')
          cat /tmp/railway_response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Railway staging API returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Staging deploy triggered"
