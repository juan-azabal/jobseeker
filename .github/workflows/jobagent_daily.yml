name: Daily Job Digest
on:
  schedule:
    - cron: '0 6 * * 1-5'  # 06:00 UTC = 07:00 CET, Mon-Fri
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to run (leave empty for all active)'
        required: false
        default: ''

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # needed to push seen_ids back to repo
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run JobAgent
        working-directory: agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          if [ -n "$TARGET_PROFILE" ]; then
            echo "=== Running JobAgent for profile: $TARGET_PROFILE ==="
            python main.py --notify --profile "$TARGET_PROFILE"
          else
            for profile_file in config/profiles/*.yaml; do
              profile_id=$(basename "$profile_file" .yaml)
              active=$(python scripts/check_active.py "$profile_file")
              if [ "$active" = "false" ]; then
                echo "=== Skipping inactive profile: $profile_id ==="
                continue
              fi
              echo "=== Running JobAgent for profile: $profile_id ==="
              python main.py --notify --profile "$profile_id"
            done
          fi

      - name: Sync results to Railway
        if: success()
        env:
          RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          TARGET_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          if [ -z "$RAILWAY_URL" ] || [ -z "$INGEST_API_KEY" ]; then
            echo "Railway secrets not set — skipping sync"
            exit 0
          fi
          for f in agent/output/jobs_*.json; do
            [ -f "$f" ] || continue
            echo "Syncing $(basename $f)..."
            if [ -n "$TARGET_PROFILE" ]; then
              payload="{\"jobs\": $(cat "$f"), \"profile_id\": \"$TARGET_PROFILE\"}"
            else
              payload="{\"jobs\": $(cat "$f")}"
            fi
            curl -sf -X POST "$RAILWAY_URL/api/ingest" \
              -H "Content-Type: application/json" \
              -H "X-Ingest-Key: $INGEST_API_KEY" \
              -d "$payload"
            echo " done"
          done

      - name: Persist seen jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent/config/seen_ids/
          git diff --cached --quiet || git commit -m "update seen jobs [skip ci]"
          git push

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: agent/output/
          retention-days: 30
          if-no-files-found: ignore
