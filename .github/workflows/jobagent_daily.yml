name: Daily Job Digest
on:
  schedule:
    - cron: '0 6 * * 1-5'  # 06:00 UTC = 07:00 CET, Mon-Fri
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to run (leave empty for all active)'
        required: false
        default: ''

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # needed to push seen_ids back to repo
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run JobAgent
        working-directory: agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          if [ -n "$TARGET_PROFILE" ]; then
            echo "=== Running JobAgent for profile: $TARGET_PROFILE ==="
            python main.py --notify --profile "$TARGET_PROFILE"
          else
            # Sub-configs (e.g. juanAza-preferences.yaml) contain a hyphen — skip them.
            overall_exit=0
            for profile_file in config/profiles/*.yaml; do
              profile_id=$(basename "$profile_file" .yaml)
              case "$profile_id" in *-*) continue ;; esac  # skip sub-configs
              active=$(python scripts/check_active.py "$profile_file")
              if [ "$active" = "false" ]; then
                echo "=== Skipping inactive profile: $profile_id ==="
                continue
              fi
              echo "=== Running JobAgent for profile: $profile_id ==="
              if python main.py --notify --profile "$profile_id"; then
                echo "=== Done: $profile_id ==="
              else
                echo "=== FAILED: $profile_id (exit $?) — continuing with remaining profiles ===" >&2
                overall_exit=1
              fi
            done
            exit $overall_exit
          fi

      - name: Sync results to Railway
        if: success()
        env:
          RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          TARGET_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          if [ -z "$RAILWAY_URL" ] || [ -z "$INGEST_API_KEY" ]; then
            echo "Railway secrets not set — skipping sync"
            exit 0
          fi
          # Ensure HTTPS — Railway redirects HTTP→HTTPS and curl won't re-send POST body
          case "$RAILWAY_URL" in http://*) RAILWAY_URL="https://${RAILWAY_URL#http://}" ;; esac
          echo "Target: $RAILWAY_URL"
          for f in agent/output/jobs_*.json; do
            [ -f "$f" ] || continue
            echo "Syncing $(basename $f)..."
            # v2 output has {"_metadata": {"profile_id": ...}, "jobs": [...]}
            # v1 legacy is a bare JSON array.  Extract profile_id + jobs for both.
            file_profile=$(python3 -c "
import json
d = json.load(open('$f'))
print(d.get('_metadata',{}).get('profile_id','') if isinstance(d,dict) else '')
" 2>/dev/null || echo "")
            effective_profile="${TARGET_PROFILE:-$file_profile}"
            jobs_payload=$(python3 -c "
import json
d = json.load(open('$f'))
print(json.dumps(d['jobs'] if isinstance(d,dict) and 'jobs' in d else d))
")
            if [ -n "$effective_profile" ]; then
              payload="{\"jobs\": $jobs_payload, \"profile_id\": \"$effective_profile\"}"
            else
              payload="{\"jobs\": $jobs_payload}"
            fi
            # Capture both body and HTTP status code; fail loudly on non-2xx
            response=$(curl -s -w "\n%{http_code}" -X POST "$RAILWAY_URL/api/ingest" \
              -H "Content-Type: application/json" \
              -H "X-Ingest-Key: $INGEST_API_KEY" \
              -d "$payload")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -1)
            echo "  HTTP $http_code (profile=${effective_profile:-none}): $body"
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "ERROR: Ingest failed with HTTP $http_code"
              exit 1
            fi
          done

      - name: Persist seen jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent/config/seen_ids/
          git diff --cached --quiet || git commit -m "update seen jobs [skip ci]"
          git push

      - name: Verify ingest health
        if: always()
        env:
          RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          if [ -z "$RAILWAY_URL" ] || [ -z "$INGEST_API_KEY" ]; then
            echo "Railway secrets not set — skipping health check"
            exit 0
          fi
          case "$RAILWAY_URL" in http://*) RAILWAY_URL="https://${RAILWAY_URL#http://}" ;; esac
          echo "=== Pipeline health ==="
          response=$(curl -s -w "\n%{http_code}" "$RAILWAY_URL/api/ingest/status" \
            -H "X-Ingest-Key: $INGEST_API_KEY")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -1)
          echo "HTTP $http_code"
          echo "$body" | python3 -m json.tool || echo "$body"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: agent/output/
          retention-days: 30
          if-no-files-found: ignore
