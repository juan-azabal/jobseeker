name: Daily Job Digest
on:
  schedule:
    - cron: '0 6 * * 1-5'  # 06:00 UTC = 07:00 CET, Mon-Fri
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to run (leave empty for all active)'
        required: false
        default: ''
      notify:
        description: 'Send email digest to users'
        type: boolean
        required: false
        default: false
      mode:
        description: 'Pipeline mode: digest (default) or reparse_rescore (digest + re-parse/re-score cache)'
        required: false
        default: 'digest'

jobs:
  # ── Job 1: Resolve active profiles ─────────────────────────────────────────
  list-profiles:
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.set-profiles.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Resolve active profiles
        id: set-profiles
        env:
          TARGET_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          if [ -n "$TARGET_PROFILE" ]; then
            echo "Single-profile run: $TARGET_PROFILE"
            echo "profiles=[\"$TARGET_PROFILE\"]" >> "$GITHUB_OUTPUT"
          else
            profiles=$(python agent/scripts/list_active_profiles.py)
            echo "Active profiles: $profiles"
            echo "profiles=$profiles" >> "$GITHUB_OUTPUT"
          fi

  # ── Job 2: Run profiles sequentially ───────────────────────────────────────
  #    Each profile syncs parsed data to Railway before the next one starts,
  #    so subsequent profiles can skip re-parsing jobs already in the DB.
  digest:
    needs: list-profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
      INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
      SHOULD_NOTIFY: ${{ github.event_name == 'schedule' || github.event.inputs.notify == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run profiles sequentially (each benefits from previous)
        run: |
          set +e  # don't abort on individual profile failure
          profiles='${{ needs.list-profiles.outputs.profiles }}'
          mode="${{ github.event.inputs.mode }}"
          mode="${mode:-digest}"
          notify_flag=""
          if [ "$SHOULD_NOTIFY" = "true" ]; then
            notify_flag="--notify"
            echo "Email notifications: ON"
          else
            echo "Email notifications: OFF (manual run)"
          fi

          # Ensure HTTPS for Railway sync
          if [ -n "$RAILWAY_URL" ]; then
            case "$RAILWAY_URL" in http://*) RAILWAY_URL="https://${RAILWAY_URL#http://}";; esac
          fi

          any_failed=false
          for profile in $(echo "$profiles" | python3 -c "import json,sys; [print(p) for p in json.load(sys.stdin)]"); do
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║  Profile: $profile"
            echo "╚══════════════════════════════════════════════════════════════╝"

            # --- Run agent ---
            cd "$GITHUB_WORKSPACE/agent"
            if python main.py $notify_flag --profile "$profile"; then
              echo "✅ Agent completed for $profile"
            else
              echo "❌ Agent failed for $profile — skipping sync"
              rm -f output/jobs_*.json
              any_failed=true
              continue
            fi

            # Note: Railway sync (POST /api/ingest) is handled inside the agent
            # pipeline at Step 10b (_sync_to_railway via httpx). No curl sync needed here.

            # --- Optional: reparse + rescore cached jobs with v1.4/v2 ---
            if [ "$mode" = "reparse_rescore" ]; then
              echo ""
              echo "── Reparse + Rescore for $profile (v1.4 parser + rubric v2)..."
              cd "$GITHUB_WORKSPACE/agent"
              if python scripts/reparse_rescore.py --profile "$profile"; then
                echo "✅ Reparse+rescore completed for $profile"
              else
                echo "⚠  Reparse+rescore failed for $profile — continuing"
                any_failed=true
              fi
            fi

            # Clean output for next profile (seen_ids stay on disk)
            rm -f output/jobs_*.json
          done

          if [ "$any_failed" = "true" ]; then
            echo ""
            echo "⚠  One or more profiles had errors (see above)"
            exit 1
          fi

      - name: Upload seen IDs
        if: always()
        run: |
          mkdir -p /tmp/seen-ids-staging
          git status --short agent/config/seen_ids/ \
            | awk '{print $2}' \
            | while read -r f; do
                [ -f "$f" ] && cp "$f" /tmp/seen-ids-staging/
              done
          count=$(ls /tmp/seen-ids-staging/ 2>/dev/null | wc -l)
          echo "Staged $count seen_ids file(s)"

      - name: Upload seen IDs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seen-ids
          path: /tmp/seen-ids-staging/
          if-no-files-found: ignore

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: agent/output/
          retention-days: 30
          if-no-files-found: ignore

  # ── Job 3: Persist seen_ids to repo ────────────────────────────────────────
  persist-seen-ids:
    needs: digest
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download seen-ids artifact
        uses: actions/download-artifact@v4
        with:
          name: seen-ids
          path: /tmp/seen-ids-download
        continue-on-error: true  # artifact may not exist if all profiles failed

      - name: Apply seen IDs to repo
        run: |
          if [ ! -d /tmp/seen-ids-download ]; then
            echo "No seen-ids artifact — nothing to apply"
            exit 0
          fi
          find /tmp/seen-ids-download -name "*.txt" | while read -r f; do
            cp "$f" agent/config/seen_ids/
            echo "Applied: $(basename $f)"
          done
          count=$(find /tmp/seen-ids-download -name "*.txt" | wc -l)
          echo "Total: $count seen_ids file(s) applied"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent/config/seen_ids/
          if git diff --cached --quiet; then
            echo "No changes to seen_ids — nothing to commit"
            exit 0
          fi
          git commit -m "update seen jobs [skip ci]"
          git pull --no-rebase -X ours origin "${{ github.ref_name }}"
          git push

  # ── Job 4: Health check ────────────────────────────────────────────────────
  verify-health:
    needs: [digest, persist-seen-ids]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify ingest health
        env:
          RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          if [ -z "$RAILWAY_URL" ] || [ -z "$INGEST_API_KEY" ]; then
            echo "Railway secrets not set — skipping health check"
            exit 0
          fi
          case "$RAILWAY_URL" in http://*) RAILWAY_URL="https://${RAILWAY_URL#http://}" ;; esac
          echo "=== Pipeline health ==="
          response=$(curl -s -w "\n%{http_code}" "$RAILWAY_URL/api/ingest/status" \
            -H "X-Ingest-Key: $INGEST_API_KEY")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -1)
          echo "HTTP $http_code"
          echo "$body" | python3 -m json.tool || echo "$body"
