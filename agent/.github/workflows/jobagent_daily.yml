name: Daily Job Digest
on:
  schedule:
    - cron: '0 6 * * 1-5'  # 06:00 UTC = 07:00 CET, Mon-Fri
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to run (leave empty for all active)'
        required: false
        default: ''

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # needed to push seen_ids back to repo
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run JobAgent for all active profiles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          profile_flag=""
          if [ -n "${{ github.event.inputs.profile }}" ]; then
            profile_flag="--profile ${{ github.event.inputs.profile }}"
          fi
          python main.py --notify $profile_flag

      - name: Persist seen jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/seen_ids/
          git diff --cached --quiet || git commit -m "update seen jobs [skip ci]"
          git push

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore
