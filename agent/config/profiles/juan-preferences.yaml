prefilter:
  deal_breakers:
  - junior
  - intern
  - internship
  - entry level
  - entry-level
  - associate product manager
  # APM removed: matches "APM (Application Performance Monitoring)" in tech job descriptions,
  # causing false positives for observability/data-platform PM roles.
  - 0-2 years
  - 1-3 years
  - 2-4 years
  title_must_contain_one_of:
  - product manager
  - product lead
  - product owner
  - principal pm
  - staff pm
  - senior pm
  title_exclude:
  - business development
  - crm manager
  - marketing manager
  - project manager
  - program manager
  - sales
  - account manager
  - customer success
  - deposit product
  - lending
  - insurance
  # growth removed: too broad. "Product Manager, Growth" is a legitimate PM role.
  exclude_companies:
  - Gartner
  - Capterra
  - GetApp
  - Software Advice
  - G2
  - Gartner Digital Markets
  - Softonic
  - Marfeel
  - LaVanguardia
  location:
    accept_remote: true
    accept_hybrid: true
    accept_onsite_cities:
    - Spain
    reject_if_requires_relocation_outside: Spain
scoring:
  auto_generate_package: 65
  manual_review: 50
  auto_reject: 50
salary:
  min_eur: 70000
  max_eur: 110000
  currency: EUR
